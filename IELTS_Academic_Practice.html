<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>IELTS Academic Practice</title>
<style>
:root{--bg:#fff;--tx:#1d2b24;--mu:#5d6b64;--g:#1f8a4c;--gl:#e6f4ec;--bd:#d5ddd8;--wa:#f4b400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15201b;--tx:#e8efeb;--mu:#9fb0a7;--gl:#1f3a2b;--bd:#35473e}color-scheme:dark}
:root[data-theme="dark"]{--bg:#15201b;--tx:#e8efeb;--mu:#9fb0a7;--gl:#1f3a2b;--bd:#35473e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:1000px;margin:auto;padding:16px}h1,h2,h3{margin:.4em 0}
.serif{font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.7}
button,.b{background:var(--g);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer;margin:2px}
button.s{background:var(--bg);color:var(--g);border:1px solid var(--g)}button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{border:1px solid var(--bd);border-radius:8px;padding:12px}.tag{background:var(--gl);color:var(--g);border-radius:10px;padding:1px 8px;font-size:13px}
.pal button{width:34px;padding:4px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.pal .a{background:var(--g);color:#fff}.pal .f{border:2px solid var(--wa)}.pal .c{outline:2px solid var(--tx)}
.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--g);padding:6px 0;position:sticky;top:0;background:var(--bg);z-index:5}
input[type=text],textarea,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
table{border-collapse:collapse}td,th{border:1px solid var(--bd);padding:4px 10px}.ok{color:var(--g)}.no{color:#c0392b}
.opt{display:block;padding:4px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.sc{overflow-x:auto}
</style></head><body><main id="app"></main><script>
const $=s=>document.querySelector(s),app=$('#app');
const TF=['True','False','Not Given'],YN=['Yes','No','Not Given'];
const HEAD=['A. A growing city hobby','B. Risks to wild bees','C. How rooftop hives work','D. Benefits for people'];
// ---------- ORIGINAL CONTENT ----------
const R=[{n:'Reading Test 1',l:'Easy',min:60,P:[{t:'Passage 1: Bees on the Rooftop',x:'<p><b>A</b> Over the past decade, keeping bees in cities has changed from an odd curiosity into a popular hobby. Rooftops in London, Paris and New York now host thousands of hives, many of them run by office workers who spend their weekends learning to handle a colony.</p><p><b>B</b> Some ecologists worry that this boom is not entirely helpful. Honeybees are managed animals, and in crowded areas they compete for flowers with wild bees, which have no keeper to feed them in poor seasons. A study of one city park found fewer wild bee species where hive numbers were highest.</p><p><b>C</b> A rooftop hive is usually a wooden box with removable frames. Bees build wax comb on the frames, and the keeper inspects them about once a week in summer. Because city temperatures are slightly higher than in the countryside, the bees start foraging earlier in spring and produce honey for several extra weeks.</p><p><b>D</b> Many keepers say the main reward is not honey but calm. Surveys of new hobbyists report lower stress levels after three months. Schools have also begun to use hives to teach children about food and nature, although no study has yet measured whether pupils\' exam results improve.</p>'}],
Q:[{t:'tf',q:'More people keep bees in cities now than ten years ago.',a:'True',e:'Para A: from curiosity to popular hobby, thousands of hives.'},
{t:'tf',q:'Honeybees are in less danger than wild bees in poor seasons.',a:'Not Given',e:'Para B says wild bees have no keeper but never compares danger levels directly... not stated as such.'},
{t:'tf',q:'Hive numbers had no link with wild bee diversity in the park study.',a:'False',e:'Fewer wild species where hives were most numerous.'},
{t:'yn',q:'The writer believes urban beekeeping should be banned.',a:'No',e:'The writer reports concerns but never argues for a ban.'},
{t:'yn',q:'The writer thinks hives in schools improve exam results.',a:'No',e:'The writer says no study has measured this; no claim is made. (Not an opinion that it improves results.)'},
{t:'mc',q:'Why do city bees make honey for longer?',o:['Flowers bloom all year','Warmer city temperatures','Keepers feed them','Hives are larger'],a:'Warmer city temperatures',e:'Para C: slightly higher temperatures, earlier foraging.'},
{t:'mc',q:'What do hobbyists say is the main reward?',o:['Money','Honey','Calm','Friendship'],a:'Calm',e:'Para D.'},
{t:'mh',q:'Which heading matches paragraph B?',o:HEAD,a:'B. Risks to wild bees',e:'Paragraph B discusses competition with wild bees.'},
{t:'txt',q:'Keepers inspect the hive about once a ______ in summer.',a:'week',e:'Para C.'},
{t:'txt',q:'Bees build wax ______ on the frames. (ONE WORD)',a:'comb',e:'Para C.'}]},
{n:'Reading Test 2',l:'Medium',min:60,P:[],Q:[]},{n:'Reading Test 3',l:'Hard',min:60,P:[],Q:[]},{n:'Reading Test 4',l:'Hardest',min:60,P:[],Q:[]}];
const L=[{n:'Listening Test 1',l:'Easier',min:30,S:'Section 1. A student phones a language centre to enrol. Receptionist: Good morning, Riverside Language Centre. Student: Hello, I would like to join the evening English course. Receptionist: Of course. Can I take your surname? Student: It is Peterson, P E T E R S O N. Receptionist: And a contact number? Student: 0 7 7 4 5 5 9 2 1 3. Receptionist: The course starts on the fourteenth of March and runs for eight weeks. Classes are on Tuesday and Thursday evenings at half past six. The fee is two hundred and forty pounds. Student: Is there a discount for students? Receptionist: Yes, ten percent if you show your student card on the first day.',
Q:[{t:'txt',q:'Surname: ______',a:'Peterson',e:'Spelled out: P-E-T-E-R-S-O-N.'},{t:'txt',q:'Phone number: 07745 ______ (last 5 digits)',a:'59213',e:'Heard digit by digit.'},{t:'txt',q:'Course start date: ______ March',a:'14',e:'"fourteenth of March".'},{t:'mc',q:'Classes are held on',o:['Monday and Friday','Tuesday and Thursday','Wednesday only'],a:'Tuesday and Thursday',e:'Stated by receptionist.'},{t:'txt',q:'Fee: £______',a:'240',e:'Two hundred and forty pounds.'},{t:'txt',q:'Student discount: ______ percent',a:'10',e:'Ten percent with a student card.'}]},{n:'Listening Test 2',l:'Harder',min:30,S:'',Q:[]}];
const W1=[{l:'Easy',t:'The table shows the percentage of households with internet access in four countries.',tb:[['Country','2005','2020'],['Norway','81','98'],['Brazil','18','74'],['India','6','50'],['Kenya','4','40']],m:'The table compares household internet access in four countries in 2005 and 2020. Overall, access rose everywhere, and the largest gains were in the countries that started lowest.\n\nIn 2005, Norway led with 81%, far ahead of Brazil (18%), India (6%) and Kenya (4%). By 2020, Norway had reached 98%, a rise of 17 points. Brazil showed the biggest increase, climbing 56 points to 74%.\n\nIndia and Kenya also grew strongly, to 50% and 40% respectively, but still trailed the other two nations. Although the gap narrowed, Norway remained the most connected throughout.'},
{l:'Medium',t:'The table shows average weekly hours of study by students in three subjects in 2000 and 2020.',tb:[['Subject','2000','2020'],['Medicine','28','31'],['Arts','15','12'],['Engineering','22','26']],m:'The table shows weekly study hours in three subjects in 2000 and 2020. Medicine and Engineering students studied more over the period, whereas Arts students studied less.\n\nMedicine students worked the longest hours in both years, rising from 28 to 31. Engineering followed, increasing from 22 to 26 hours.\n\nBy contrast, Arts was the only subject to decline, falling from 15 to 12 hours, so the gap between Arts and Medicine widened from 13 to 19 hours.'},
{l:'Hard',t:'The table shows the share of energy from renewable sources in three countries (%).',tb:[['Country','1990','2005','2020'],['Denmark','6','16','34'],['Spain','8','9','21'],['Poland','7','7','16']],m:'The table illustrates renewable energy shares in three countries across three years. Every country increased its share, with Denmark growing most dramatically.\n\nDenmark rose from 6% to 16% and then to 34%, more than five times its 1990 level. Spain stayed near 8-9% until 2005 before reaching 21%.\n\nPoland was flat at 7% until 2005 and ended at 16%, the lowest figure in 2020 though still more than double its start.'}];
const W2=[['Easy','Some people think children should learn a foreign language from primary school. Do the advantages outweigh the disadvantages?','Introduction paraphrases and gives a clear opinion. Body 1: young brains learn sounds faster; future job prospects. Body 2: possible pressure and less time for other subjects, but outweighed by benefits. Conclusion restates the view.'],['Medium','Some believe the government should pay for public transport; others think users should pay. Discuss both views and give your opinion.','Discuss free transport (equality, less pollution) and user-pays (fair funding, better service). Give a balanced opinion with examples such as congestion in cities.'],['Hard','Technology is making people less able to think for themselves. To what extent do you agree or disagree?','Argue a position: calculators, search engines and algorithms reduce effort, yet they free time for higher-level thinking. Concede a counter-point, use precise examples and a clear thesis.']];
const SP=[['Hometown','Where is your hometown?','What do you like about it?','a place you enjoyed visiting','Why do people move to cities?','Will villages disappear?','I\'d like to talk about a lake I visited last summer. It was peaceful, and what I remember most is the clear water, which made it a perfect break from my busy routine.'],['Work or Study','Do you work or study?','Why did you choose it?','a teacher who helped you','What makes a good teacher?','Should education be free?','I\'d like to describe my maths teacher, Mr Lee. He was patient and explained ideas in simple ways, which is why I started to enjoy the subject.'],['Food','What food do you like?','Do you cook?','a meal you enjoyed','Are eating habits changing?','Is fast food a problem?','The meal I\'d like to describe was a family dinner. We cooked together, and the soup was delicious, so it felt special.'],['Hobbies','What do you do in your free time?','Do you prefer indoor or outdoor activities?','a hobby you would like to try','Why do people need hobbies?','Do hobbies bring people together?','I\'ve always wanted to try painting. It looks relaxing, and I think it would help me express myself in a creative way.'],['Travel','Do you like travelling?','How do you usually travel?','a journey you remember','Is tourism good for a country?','How will travel change?','A journey I remember was a night train across the country. The scenery was stunning, and I met friendly people.'],['Technology','How often do you use your phone?','What apps do you use most?','a useful gadget','Does technology make life easier?','Are people too dependent on devices?','My most useful gadget is my laptop. I use it daily for study, and I couldn\'t manage without it.'],['Friends','Do you have many friends?','How do you stay in touch?','a close friend','Why is friendship important?','Do online friends count?','My closest friend is Anna. We met at school, and she is always honest and supportive.'],['Health','Do you exercise?','What do you do to relax?','a time you were healthy and active','Who is responsible for public health?','Should unhealthy food be taxed?','Last year I trained for a 10 km run. It was demanding, but it made me feel energetic and more confident.'],['Environment','Do you recycle?','Is your area clean?','a place with a lot of nature','What can individuals do about climate change?','Should governments ban plastic?','The place is a forest near my town. It is calm, and the fresh air always lifts my mood.'],['Media','What do you like to watch or read?','Do you read the news?','a film or book you enjoyed','Is traditional media disappearing?','How does media shape opinion?','I\'d like to talk about a novel on friendship. The plot was gripping, and I learned a lot from the characters.'],['Culture','Is there a festival in your country?','Do you enjoy it?','a tradition in your culture','Should traditions be preserved?','How does globalisation affect culture?','One tradition I value is a lantern festival. Families gather, and it keeps our heritage alive.'],['Ambition','What are your goals?','Where do you see yourself in five years?','a goal you want to achieve','Does success mean money?','Do young people have too much pressure?','My goal is to score band 6.5. I\'m studying consistently because it will open up opportunities abroad.']];
const WCRIT=['Task Achievement/Response: I covered every part of the task with a clear position','Coherence & Cohesion: logical paragraphs and linking words','Lexical Resource: varied, accurate vocabulary','Grammatical Range & Accuracy: complex sentences with few errors'];
// ---------- ENGINE ----------
let store={};try{store=JSON.parse(localStorage.getItem('ielts')||'{}')}catch(e){}
const save=(k,v)=>{if(!(store[k]>=v))store[k]=v;try{localStorage.setItem('ielts',JSON.stringify(store))}catch(e){}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const band=r=>{const x=Math.round(r);return x>=39?9:x>=37?8.5:x>=35?8:x>=33?7.5:x>=30?7:x>=27?6.5:x>=23?6:x>=19?5.5:x>=15?5:x>=13?4.5:x>=10?4:'<4'};
let tm;const clock=(sec,el,done)=>{clearInterval(tm);const t=Date.now()+sec*1e3;const f=()=>{let r=Math.max(0,Math.round((t-Date.now())/1e3));el.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');if(!r){clearInterval(tm);done()}};f();tm=setInterval(f,500)};
function home(){clearInterval(tm);speechSynthesis.cancel();
const c=(h,d)=>`<div class="card"><h3>${h}</h3>${d}</div>`;
app.innerHTML=`<h1>IELTS Academic Practice</h1><p>Target band 6.0+. Ordered easy to hard. All material is original.</p><div class="grid">`+
c('Reading',R.map((t,i)=>`<div>${t.l} <span class="tag">best ${store['r'+i]??'–'}/40</span> <button onclick="exam('r',${i})" ${t.Q.length?'':'disabled'}>${t.n}${t.Q.length?'':' (soon)'}</button></div>`).join(''))+
c('Listening',L.map((t,i)=>`<div>${t.l} <span class="tag">best ${store['l'+i]??'–'}/40</span> <button onclick="exam('l',${i})" ${t.Q.length?'':'disabled'}>${t.n}${t.Q.length?'':' (soon)'}</button></div>`).join(''))+
c('Writing',`<div>Task 1 × 3, Task 2 × 3</div><button onclick="writing()">Open</button>`)+
c('Speaking',`<div>${SP.length} sets</div><button onclick="speaking()">Open</button>`)+`</div>
<p style="color:var(--mu)">Note: this first release includes a full working engine and sample-length tests (not 40 questions each). Scores are scaled to /40 for the band conversion.</p>`}
let S;
function exam(k,i){const T=(k=='r'?R:L)[i];S={k,i,T,a:[],f:[],c:0,done:false};T.Q.forEach((q,j)=>S.a[j]='');drawExam();
clock(T.min*60,$('#tm'),()=>submit(true))}
function drawExam(){const{T,k,c,done}=S,q=T.Q[c];
const pass=k=='r'?T.P.map(p=>`<h3>${p.t}</h3><div class="serif">${p.x}</div>`).join(''):
`<h3>Recording</h3><button onclick="play()">▶ Play</button><button class="s" onclick="speechSynthesis.pause()">⏸ Pause</button><button class="s" onclick="speechSynthesis.resume()">⏯ Resume</button><button class="s" onclick="speechSynthesis.cancel()">⏹ Stop</button><p style="color:var(--mu)">Uses your browser voice. Transcript appears after submitting.</p>`+(done?`<div class="serif"><b>Transcript</b><br>${esc(T.S)}</div>`:'');
let inp='';if(q.o){inp=q.o.map(o=>`<label class="opt"><input type="radio" name="q" ${S.a[c]==o?'checked':''} ${done?'disabled':''} onchange="S.a[${c}]=this.value;pal()" value="${esc(o)}"> ${esc(o)}</label>`).join('')}
else if(q.t=='tf'||q.t=='yn')inp='';
else inp=`<input type="text" value="${esc(S.a[c])}" ${done?'disabled':''} oninput="S.a[${c}]=this.value;pal()">`;
if(q.t=='tf'||q.t=='yn'){inp=(q.t=='tf'?TF:YN).map(o=>`<label class="opt"><input type="radio" name="q" ${S.a[c]==o?'checked':''} ${done?'disabled':''} onchange="S.a[${c}]=this.value;pal()" value="${o}"> ${o}</label>`).join('')}
app.innerHTML=`<div class="bar"><b>${T.n} · ${T.l}</b><b>⏱ <span id="tm"></span></b><button onclick="${done?'home()':'confirmSub()'}">${done?'Home':'Submit'}</button></div>
<div class="two"><div class="sc">${pass}</div><div><h3>Question ${c+1} of ${T.Q.length}</h3><p>${esc(q.q)}</p>${inp}
${done?`<p class="${ok(c)?'ok':'no'}"><b>${ok(c)?'Correct':'Incorrect'}</b> — answer: ${esc(q.a)}<br>${esc(q.e)}</p>`:`<button class="s" onclick="S.f[${c}]=!S.f[${c}];drawExam()">${S.f[c]?'Unflag':'Flag for review'}</button>`}
<div><button onclick="go(-1)" ${c?'':'disabled'}>◀ Previous</button><button onclick="go(1)" ${c<T.Q.length-1?'':'disabled'}>Next ▶</button></div>
<div class="pal" id="pal"></div></div></div>`;pal();if(done)$('#tm').textContent='Finished'}
const ok=j=>String(S.a[j]).trim().toLowerCase()==S.T.Q[j].a.toLowerCase();
function pal(){$('#pal').innerHTML='<p>'+S.T.Q.map((q,j)=>`<button class="${S.a[j]!==''?'a':''} ${S.f[j]?'f':''} ${j==S.c?'c':''}" onclick="S.c=${j};drawExam()">${j+1}</button>`).join('')+'</p><small>Green = answered · yellow border = flagged · outlined = current</small>'}
function go(d){S.c+=d;drawExam()}
function play(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(S.T.S);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}
function confirmSub(){const un=S.a.filter(x=>x==='').length;if(confirm(un?`${un} question(s) unanswered. Submit anyway?`:'Submit your answers?'))submit()}
function submit(){if(S.done)return;clearInterval(tm);speechSynthesis.cancel();S.done=true;const n=S.T.Q.length,sc=S.T.Q.filter((q,j)=>ok(j)).length,sc40=sc/n*40;save(S.k+S.i,Math.round(sc40));
alert(`Score: ${sc}/${n}\nScaled to 40: ${Math.round(sc40)}/40\nBand: ${band(sc40)}\n\nReview each question's answer in the exam page.`);S.c=0;drawExam()}
function writing(){clearInterval(tm);let h='<p><button class="s" onclick="home()">← Home</button></p><h1>Writing</h1><h2>Task 1 (min 150 words)</h2>';
W1.forEach((w,i)=>h+=`<button onclick="wr(1,${i})">${w.l}</button>`);h+='<h2>Task 2 (min 250 words)</h2>';W2.forEach((w,i)=>h+=`<button onclick="wr(2,${i})">${w[0]}</button>`);app.innerHTML=h}
function wr(t,i){const w=t==1?W1[i]:W2[i],min=t==1?150:250;
app.innerHTML=`<div class="bar"><b>Task ${t} · ${t==1?w.l:w[0]}</b><b>⏱ <span id="tm"></span></b><button class="s" onclick="writing()">Back</button></div><p class="serif">${esc(t==1?w.t:w[1])}</p>`+(t==1?`<div class="sc"><table>${w.tb.map((r,x)=>'<tr>'+r.map(c=>x?`<td>${c}</td>`:`<th>${c}</th>`).join('')+'</tr>').join('')}</table></div>`:'')+
`<textarea id="ta" rows="14" placeholder="Write here..."></textarea><p>Words: <b id="wc">0</b> / min ${min}</p><button onclick="subW(${t},${i})">Submit</button><div id="res"></div>`;
$('#ta').oninput=()=>{const n=($('#ta').value.match(/\S+/g)||[]).length;$('#wc').textContent=n;$('#wc').className=n>=min?'ok':'no'};clock(3600,$('#tm'),()=>subW(t,i))}
function subW(t,i){clearInterval(tm);const w=t==1?W1[i]:W2[i];$('#res').innerHTML=`<h3>${t==1?'Band 7+ model answer':'Planning guide for a Band 7+ answer'}</h3><div class="serif">${esc(t==1?w.m:w[2]).replace(/\n/g,'<br>')}</div><h3>Self-check</h3>`+WCRIT.map(c=>`<label class="opt"><input type="checkbox"> ${c}</label>`).join('')}
let rec;
function speaking(){clearInterval(tm);app.innerHTML='<p><button class="s" onclick="home()">← Home</button></p><h1>Speaking</h1><div class="grid">'+SP.map((s,i)=>`<button onclick="sp(${i})">Set ${i+1} · ${s[0]}</button>`).join('')+'</div>'}
function sp(i){const s=SP[i];app.innerHTML=`<p><button class="s" onclick="speaking()">← Sets</button></p><h2>Set ${i+1}: ${s[0]}</h2><h3>Part 1</h3><ul><li>${s[1]}</li><li>${s[2]}</li></ul>
<h3>Part 2 cue card</h3><div class="card serif"><b>Describe ${s[3]}.</b><br>You should say: what/who it is · when and where · and explain why it matters to you.</div>
<p><button onclick="t2(60,'Prepare')">Start 1-min prep</button><button onclick="t2(120,'Talk')">Start 2-min talk</button> <b id="tl"></b></p>
<p><button class="s" onclick="mic()">🎙 Record</button><button class="s" onclick="rec&&rec.stop()">Stop</button> <span id="ms"></span></p><div id="au"></div>
<h3>Part 3</h3><ul><li>${s[4]}</li><li>${s[5]}</li></ul><button onclick="$('#sa').hidden=false">Show sample answer</button><div id="sa" hidden class="serif"><h3>Sample (Part 2)</h3>${esc(s[6])}</div>`}
function t2(sec,l){clock(sec,$('#tl'),()=>{$('#tl').textContent=l+' time over'})}
async function mic(){try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{st.getTracks().forEach(x=>x.stop());$('#au').innerHTML='<audio controls src="'+URL.createObjectURL(new Blob(ch))+'"></audio>';$('#ms').textContent=''};rec.start();$('#ms').textContent='Recording…'}catch(e){$('#ms').textContent='Microphone unavailable here.'}}
home();
</script></body></html>
