const CH={"g": {"e": [["I saw ___ interesting film last night.", ["a", "an", "the", "no article"], 1, "স্বরধ্বনি (a, e, i, o, u-এর আওয়াজ) দিয়ে শুরু হওয়া শব্দের আগে an বসে — interesting-এর শুরুতে i-এর আওয়াজ।"], ["My birthday is ___ 12 May.", ["in", "on", "at", "of"], 1, "নির্দিষ্ট তারিখের আগে on বসে — on 12 May। মাসের আগে in, ঘড়ির সময়ের আগে at।"], ["Rahim ___ in a bank, but today he ___ at home.", ["works / stays", "is working / is staying", "works / is staying", "is working / stays"], 2, "সাধারণ অভ্যাসে Present Simple (works), আর আজকের অস্থায়ী অবস্থায় Present Continuous (is staying)।"], ["They ___ to Cox's Bazar last month.", ["go", "went", "gone", "going"], 1, "শেষ হয়ে যাওয়া অতীতের কাজে Past Simple — go-এর past form went। last month অতীতের সময় বোঝায়।"], ["Every student ___ a uniform in this school.", ["wear", "wears", "wearing", "wore"], 1, "Every + singular noun-এর পর singular verb বসে — Every student wears।"], ["There are three ___ playing in the garden.", ["childs", "childrens", "children", "child"], 2, "child-এর plural হলো children — childs বা childrens বলে কিছু নেই।"], ["Dhaka is ___ than Khulna.", ["big", "bigger", "biggest", "more big"], 1, "দুটি জিনিসের তুলনায় comparative form বসে — bigger than। biggest হলো superlative, তিন বা তার বেশি জিনিসের জন্য।"], ["___ a lot of books on the shelf.", ["There is", "There are", "There has", "It is"], 1, "plural noun (books)-এর আগে There are বসে। singular হলে There is হতো।"], ["I need ___ water, please.", ["a", "many", "some", "few"], 2, "water uncountable noun — এর আগে some বসে। many/few শুধু countable noun-এর সঙ্গে বসে।"], ["Which sentence is correct?", ["She always is happy.", "She is always happy.", "Always she is happy.", "She happy is always."], 1, "adverb of frequency (always) বসে be verb-এর পরে — She is always happy।"]], "m": [["If it rains tomorrow, we ___ at home.", ["stay", "will stay", "would stay", "stayed"], 1, "First Conditional: If + Present Simple, will + verb — বাস্তব সম্ভাবনা বোঝায়।"], ["If I ___ rich, I would travel the world.", ["am", "was", "were", "will be"], 2, "Second Conditional: If + Past Simple, would + verb — কাল্পনিক অবস্থা। I-এর সঙ্গেও were বসে, was নয়।"], ["Rice ___ in many parts of Bangladesh.", ["grows", "is grown", "grew", "growing"], 1, "Present Simple passive: is/are + past participle (V3) — Rice is grown। কাজটা কে করে সেটা গুরুত্বপূর্ণ নয়।"], ["This is the teacher ___ helped me pass the exam.", ["who", "which", "whose", "where"], 0, "ব্যক্তির জন্য relative pronoun who বসে। which জিনিসের জন্য, where জায়গার জন্য।"], ["He said that he ___ very tired.", ["is", "was", "has been", "will be"], 1, "Reported speech-এ Direct speech-এর Present Simple (am/is) Past Simple (was) হয়ে যায়।"], ["You ___ wear a helmet when you ride a motorbike.", ["must", "might", "could", "would"], 0, "বাধ্যবাধকতা বা নিয়ম বোঝাতে must বসে। might/could সম্ভাবনা বোঝায়।"], ["I ___ just finished my homework.", ["have", "has", "had", "am"], 0, "just-এর সঙ্গে Present Perfect বসে — have/has + V3। I-এর সঙ্গে have।"], ["I enjoy ___ novels in my free time.", ["read", "to read", "reading", "reads"], 2, "enjoy-এর পর gerund (verb + ing) বসে — enjoy reading।"], ["___ it was raining, we went for a walk.", ["Despite", "In spite", "Although", "Because of"], 2, "Although-এর পর clause (it was raining) বসে। Despite/In spite of-এর পর noun phrase বসে — Despite the rain।"], ["You like cricket, ___?", ["don't you", "aren't you", "didn't you", "isn't it"], 0, "Question tag: positive sentence-এর tag negative হয়, একই tense ও auxiliary দিয়ে — You like (do) → don't you।"]], "h": [["If you had told me earlier, I ___ you.", ["would help", "will help", "would have helped", "help"], 2, "Third Conditional: If + Past Perfect, would have + V3 — অতীতের ঘটনা যা আর বদলানো যায় না।"], ["If I had saved more money, I ___ a car now.", ["would have bought", "will buy", "would buy", "buy"], 2, "Mixed Conditional: অতীতের শর্ত (had saved) + বর্তমানের ফল (would buy) — would + verb।"], ["Never ___ such a const LIVE_R=[{n:'Reading Test 1',l:'Easy',min:60,P:[{t:'Passage 1: Bees on the Rooftop',x:'<p><b>A</b> Over the past decade, keeping bees in cities has changed from an odd curiosity into a popular hobby. Rooftops in London, Paris and New York now host thousands of hives, many of them run by office workers who spend their weekends learning to handle a colony.</p><p><b>B</b> Some ecologists worry that this boom is not entirely helpful. Honeybees are managed animals, and in crowded areas they compete for flowers with wild bees, which have no keeper to feed them in poor seasons. A study of one city park found fewer wild bee species where hive numbers were highest.</p><p><b>C</b> A rooftop hive is usually a wooden box with removable frames. Bees build wax comb on the frames, and the keeper inspects them about once a week in summer. Because city temperatures are slightly higher than in the countryside, the bees start foraging earlier in spring and produce honey for several extra weeks.</p><p><b>D</b> Many keepers say the main reward is not honey but calm. Surveys of new hobbyists report lower stress levels after three months. Schools have also begun to use hives to teach children about food and nature, although no study has yet measured whether pupils\' exam results improve.</p>'},
{t:'Passage 2: A Short History of the Bicycle',x:'<p><b>A</b> In 1817 a German inventor, Karl von Drais, built a wooden "running machine". It had two wheels but no pedals, so the rider pushed along the ground with both feet. It was heavy and slow, and it never became common.</p><p><b>B</b> In the 1860s French makers fixed pedals to the front wheel. The new machine had iron rims on its wheels, and on rough roads the ride was so uncomfortable that people nicknamed it the "boneshaker".</p><p><b>C</b> In the 1870s the high-wheeler appeared. Its huge front wheel carried the rider further with each turn of the pedals. However, riders sat high above the ground and could be thrown forward over the handlebars, so it was used mostly by young men.</p><p><b>D</b> The Rover safety bicycle of 1885, designed by John Starley, had two wheels of equal size and a chain that drove the rear wheel. It was low and stable. Women began to ride in large numbers, and many described a new sense of independence.</p><p><b>E</b> In 1888 John Dunlop made a tyre filled with air for his young son\'s tricycle. The ride became far smoother, and the idea was soon copied on bicycles everywhere. Today there are well over a billion bicycles in the world.</p>'},
{t:'Passage 3: Why Sleep Matters for Students',x:'<p><b>A</b> Teenagers need between eight and ten hours of sleep a night, yet most get only about seven. Sleep scientists warn that this shortfall harms both mood and memory.</p><p><b>B</b> During deep sleep the brain replays the events of the day and moves information from short-term into long-term memory. In one experiment, students who learned 30 new words and then slept recalled about 20 per cent more than students who stayed awake.</p><p><b>C</b> The body clock also changes in the teenage years, so young people feel sleepy later at night. Early school start times clash with this pattern. One school district moved its start time by 60 minutes, and lateness fell sharply.</p><p><b>D</b> Light from phone screens delays the release of melatonin, the hormone that signals bedtime. It is sensible to switch off devices an hour before going to bed.</p><p><b>E</b> Researchers disagree about whether extra sleep at weekends can make up for lost sleep during the week, and more work is needed.</p>'}],

/* ===== robust TTS: pick an English voice, speak in short chunks, keep Chrome from stalling ===== */
let _voices=[];
function loadVoices(){try{_voices=speechSynthesis?speechSynthesis.getVoices():[]}catch(e){_voices=[]}return _voices}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){const vs=_voices.length?_voices:loadVoices();return vs.find(v=>/^en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||vs[0]||null}
let _speakTimer=null;
function speakChunks(text,onDone){
 if(!('speechSynthesis' in window)){onDone&&onDone(false);return}
 try{speechSynthesis.cancel()}catch(e){}
 const v=pickVoice();
 const chunks=String(text||'').match(/[^.!?]+[.!?]+["'")\]]?\s*|[^.!?]+$/g)||[];
 let i=0,stopped=false;
 const step=()=>{
  if(stopped||i>=chunks.length){if(_speakTimer){clearInterval(_speakTimer);_speakTimer=null}onDone&&onDone(true);return}
  const u=new SpeechSynthesisUtterance(chunks[i++].trim());
  u.lang='en-GB';if(v)u.voice=v;u.volume=(vol||100)/100;u.rate=1;
  u.onend=step;u.onerror=()=>{stopped=true;if(_speakTimer){clearInterval(_speakTimer);_speakTimer=null}onDone&&onDone(false)};
  try{speechSynthesis.speak(u)}catch(e){stopped=true;if(_speakTimer){clearInterval(_speakTimer);_speakTimer=null}onDone&&onDone(false)}
 };
 if(!chunks.length){onDone&&onDone(false);return}
 _speakTimer=setInterval(()=>{try{if(speechSynthesis.speaking)speechSynthesis.resume()}catch(e){}},3000);
 step();
}

function Q(q){const k=key(M,q),v=S.a[k]||'';let h;

else{const o=q.k=='tf'?['TRUE','FALSE','NOT GIVEN']:q.k=='yn'?['Yes','No','Not Given']:q.o;h=q.q+o.map(x=>{const val=x;return `<label><input type=radio name=r${q.n} ${v==val?'checked':''} onchange="ans('${k}','${escq(val)}')"> ${x}</label>`}).join('')}

const vcount=()=>Object.values(S.vl||{}).filter(Boolean).length;
V.spk=()=>{A.innerHTML=hdr('',`<button onclick="go('dash')">← Dashboard</button>`)+`<div class=wrap><h1>Speaking — choose a set</h1><div class=grid>${LIVE_SP.map((s,i)=>`<div class=card><h3>Set ${i+1} · ${s[0]}</h3><p>Part 1, cue card, Part 3</p><button class=b onclick="S.spk=${i};MOD.S.parts=buildSParts(${i});save();go('prac','S')">Start →</button></div>`).join('')}</div></div>`};
V.vg=()=>{A.innerHTML=hdr('',`<button onclick="go('dash')">← Dashboard</button>`)+`<div class=wrap><h1>Vocabulary & Grammar</h1><div class=grid><div class=card><h3>Week 1 — Vocabulary</h3><p>50 words · <span id=vc>${vcount()}</span> / 50 learned</p><button class=b onclick="go('voc')">Open</button></div><div class=card><h3>Week 1 — Grammar</h3>${LIVE_G.map((g,i)=>`<div>${g.t} <span class=tag>best ${S.g?.[i]??'–'}/5</span> <button class=s onclick="go('gr',${i})">Open</button></div>`).join('')}</div><div class=card><h3>Challenge</h3><p>Grammar + Vocabulary · 30 + 30 questions · Easy / Medium / Hard</p><button class=b onclick=\"go('chal','g')\">Grammar Challenge</button> <button class=b onclick=\"go('chal','v')\">Vocabulary Challenge</button></div></div></div>`};
V.voc=()=>{S.vl=S.vl||{};const y=scrollY;
A.innerHTML=hdr('',`<button onclick="go('vg')">← Back</button>`)+`<div class=wrap><h1>Week 1 — Vocabulary</h1><p><b id=vc>${vcount()} / 50 learned</b> <button class=s onclick="S.vt=!S.vt;save();go('voc')">${S.vt?'Exit test mode':'Test yourself'}</button></p>`+LIVE_V.map(d=>`<h2>${d[0]}</h2>`+d[1].map(s=>{const[w,b,e]=s.split('|');const h=S.vt&&!rv[w];return `<div class=card><b>${w}</b> — ${h?`<button class=s onclick="rv['${w}']=1;go('voc')">Reveal meaning</button>`:b}<br><i>${esc(e)}</i><br><label><input type=checkbox ${S.vl[w]?'checked':''} onchange="S.vl['${w}']=this.checked;save();document.querySelector('#vc').textContent=vcount()+' / 50 learned'"> Mark as learned</label></div>`}).join('')).join('')+`</div>`;scrollTo(0,y)};
V.gr=i=>{const g=LIVE_G[i];A.innerHTML=hdr('',`<button onclick="go('vg')">← Back</button>`)+`<div class=wrap><h1>${g.t}</h1><div class="card serif">${g.r}</div><div class="card serif">${BN[i]}</div>`+g.x.map((x,j)=>`<div class=card><p>${j+1}. ${esc(x[0])}</p>`+(x[1]?`<select id="x${j}"><option value="">— choose —</option>${x[1].map(o=>`<option>${o}</option>`).join('')}</select>`:`<input type=text id="x${j}" style="width:100%;padding:.6em;border:1px solid #888;border-radius:.5rem">`)+`<div id="f${j}"></div></div>`).join('')+`<button class=b onclick="chkGr(${i})">Check</button> <b id=gs></b></div>`};
function chkGr(i){const g=LIVE_G[i];let s=0;const nm=v=>String(v||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/[.\s]+$/,'');g.x.forEach((x,j)=>{const el=document.getElementById('x'+j);const ok=nm(el.value)==nm(x[2]);if(ok)s++;document.getElementById('f'+j).innerHTML=`<p class="${ok?'ok':'no'}"><b>${ok?'Correct':'Incorrect'}</b> — answer: ${esc(x[2])}<br>Why: ${g.w}</p>`});document.getElementById('gs').textContent=`Score: ${s} / 5`;S.g=S.g||{};if(!(S.g[i]>=s))S.g[i]=s;save()}

/* ===== Challenge views: level picker, word bank, quiz ===== */
V.chal=(k)=>{const b=S.ch?.[k]||{};A.innerHTML=hdr('',`<button onclick=\"go('vg')\">← Vocabulary & Grammar</button>`)+`<div class=wrap><h1>${CHN[k]}</h1><p>10 questions per level · untimed · instant Bangla explanations · best score saved</p><div class=grid>${['e','m','h'].map(l=>`<div class=card><h3>${CHL[l]}</h3><p>10 questions · best ${b[l]??'–'}/10</p>${k=='v'&&(l=='m'||l=='h')?'<p><small>Word bank first, then the quiz.</small></p>':''}<button class=b onclick=\"go('${k=='v'&&(l=='m'||l=='h')?'chb':'chq'}','${k}','${l}')">${k=='v'&&(l=='m'||l=='h')?'Word bank →':'Start →'}</button></div>`).join('')}</div><button class=o onclick=\"go('dash')\">← Dashboard</button></div>`};
V.chb=(k,l)=>{A.innerHTML=hdr('',`<button onclick=\"go('chal','${k}')">← ${CHN[k]}</button>`)+`<div class=wrap><h1>${CHL[l]} — Word bank</h1><p>Learn these 10 words first, then take the quiz.</p>${CHB[l].map(w=>`<div class=card><b>${w[0]}</b> — ${w[1]}<br><i>${esc(w[2])}</i></div>`).join('')}<button class=b onclick=\"go('chq','${k}','${l}')">Start quiz →</button></div>`};
V.chq=(k,l)=>{CHS={k,l,ans:{},n:0};const qs=CH[k][l];A.innerHTML=hdr('',`<button onclick=\"go('chal','${k}')">← ${CHN[k]}</button>`)+`<div class=wrap><h1>${CHN[k]} — ${CHL[l]}</h1><p>Answer all 10 questions. Tap an option to see the Bangla explanation at once.</p><div id=chsc></div>${qs.map((q,i)=>`<div class=card id=\"cq${i}\"><p><b>${i+1}.</b> ${esc(q[0])}</p>${q[1].map((o,j)=>`<button class=o style=\"display:block;width:100%;text-align:left;margin:.3rem 0\" onclick=\"chkCh(${i},${j},this)\">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}<div id=\"cf${i}\"></div></div>`).join('')}<button class=o onclick=\"go('chal','${k}')">← Back to levels</button></div>`};
function chkCh(i,j,btn){const c=CHS;if(c.ans[i]!=null)return;const q=CH[c.k][c.l][i],ok=j==q[2];c.ans[i]=ok;c.n++;const card=document.getElementById('cq'+i);card.querySelectorAll('button').forEach(b=>b.disabled=true);btn.style.background=ok?'#16a34a':'#E11D2E';btn.style.color='#fff';if(!ok){const cb=card.querySelectorAll('button')[q[2]];cb.style.background='#16a34a';cb.style.color='#fff'}document.getElementById('cf'+i).innerHTML=`<p class=\"${ok?'ok':'no'}\"><b>${ok?'✓ Correct':'✗ Incorrect'}</b> — correct answer: ${esc(q[1][q[2]])}<br>${esc(q[3])}</p>`;if(c.n==10){const s=Object.values(c.ans).filter(Boolean).length;S.ch=S.ch||{};S.ch[c.k]=S.ch[c.k]||{};if(!(S.ch[c.k][c.l]>=s))S.ch[c.k][c.l]=s;save();document.getElementById('chsc').innerHTML=`<div class=card><b style=\"font-size:1.4rem\">Score: ${s} / 10</b><p>${s>=9?'Excellent — Band 7 feel!':s>=7?'Well done — solid Band 6.':s>=5?'Good — review the explanations and retry.':'Keep practising — read every explanation, then retry.'}</p><p>Best score for ${CHL[c.l]}: ${S.ch[c.k][c.l]}/10</p><button class=b onclick=\"go('chq','${c.k}','${c.l}')\">Retry ↻</button> <button class=o onclick=\"go('chal','${c.k}')">← Back to levels</button></div>`;scrollTo(0,0)}}
/* results */
function calc(){const r={};['L','R'].forEach(m=>{const q=qsOf(m),c=q.filter(x=>norm(S.a[key(m,x)])==norm(x.a)).length;r[m]={c,t:q.length,b:band(c,q.length)}});
r.W={wc:[1,2].map(i=>(S.w[i].trim().match(/\S+/g)||[]).length)};r.ov=Math.round((r.L.b+r.R.b)/2*2)/2;S.r=r;save()}
V.res=()=>{const r=S.r;A.innerHTML=hdr('',`<button onclick="go('dash')">← Dashboard</button>`)+`<div class=wrap><div class=card><div class=big>${r.ov}</div><b>Overall band</b> (Listening & Reading; Writing and Speaking need examiner or AI marking)</div>
<div class=grid>${['L','R'].map(m=>`<div class=card><h3>${MOD[m].n}</h3><b style="font-size:2rem">${r[m].b}</b><p>${r[m].c} / ${r[m].t}</p><div class=bar><i style="width:${r[m].c/r[m].t*100}%"></i></div></div>`).join('')}<div class=card><h3>Writing</h3><p>Task 1: ${r.W.wc[0]} words<br>Task 2: ${r.W.wc[1]} words</p><small>AI feedback: connect a marking API.</small></div><div class=card><h3>Speaking</h3><p>Recordings are not stored. Self-assess.</p></div></div>
<h3>Review</h3>${['L','R'].map(m=>qsOf(m).map(q=>{const y=S.a[m+q.n]||'—',ok=norm(y)==norm(q.a);return `<div class=sec><span>${MOD[m].n} Q${q.n}${q.e?`<br><small>${esc(q.e)}</small>`:''}</span><span class=${ok?'ok':'no'}>${y} ${ok?'✓':'✗ → '+(q.ae||q.a)}</span></div>`}).join('')).join('')}
<h3>Listening transcript</h3><div class=card style="font-family:Georgia,serif;line-height:1.7">${MOD.L.parts.map(x=>esc(x.say)).join('<br><br>')}</div><button class=b onclick="if(confirm('Start a new mock?')){localStorage.clear();location.reload()}">New mock</button></div>`};
T();Z();go('dash');
</script></body></html>
